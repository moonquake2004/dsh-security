name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install zstd (session logs are zstd-compressed)
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Show runtime versions
        run: node --version && zstd --version
      - name: Run the test suite
        run: node --test test/*.mjs
      # 自检：确保所有内置检查在干净环境里都能加载并注册（registry 无 list()，
      # 用 getByPhase 各阶段计数，避免"看起来跑了其实没注册"的假绿）
      - name: Smoke — the built-in checks all register
        run: |
          node --input-type=module -e "
          import { createDefaultRegistry } from './src/registry.mjs';
          import { CheckPhase } from './src/protocol/phase.mjs';
          const reg = await createDefaultRegistry(false);
          const phases = Object.values(CheckPhase);
          let total = 0;
          for (const ph of phases) {
            const n = reg.getByPhase(ph).length;
            total += n;
            console.log(ph.padEnd(14), n);
          }
          console.log('TOTAL', total);
          if (total < 20) { console.error('registered too few checks:', total); process.exit(1); }
          "
